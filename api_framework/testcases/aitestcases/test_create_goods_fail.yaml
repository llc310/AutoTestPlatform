-
  feature: 登录模块
  story: 登录接口
  title: 登录成功
  description: 登录admin账号
  requests:
    method: post
    url: /api/private/v1/login
    headers:
      Content-Type: application/json
    json:
      username: admin
      password: '123456'
  extract:
    -
      key: token
      attr: json
      expr: $.data.token
-
  feature: 商品管理模块
  story: 添加商品接口
  title: 预置商品-用于重复名称测试
  description: 创建一个商品用于后续重复名称断言
  requests:
    method: post
    url: /api/private/v1/goods
    headers:
      Authorization: ${read_extract(token)}
      Content-Type: application/json
    json:
      goods_name: 预置商品${random_str(6)}
      goods_price: 99
      goods_number: 100
      goods_cat: '1,2,3'
      goods_weight: 1
  extract:
    -
      key: dup_goods_name
      attr: json
      expr: $.data.goods_name
-
  feature: 商品管理模块
  story: 添加商品接口
  title: $parametrize{title}
  description: 添加商品失败-$parametrize{desc}
  requests:
    method: post
    url: /api/private/v1/goods
    headers:
      Authorization: $parametrize{Authorization}
      Content-Type: application/json
    json:
      goods_name: $parametrize{goods_name}
      goods_price: $parametrize{goods_price}
      goods_number: $parametrize{goods_number}
      goods_cat: $parametrize{goods_cat}
      goods_weight: 1
  parametrize:
    title:
      - test_create_goods_fail_01
      - test_create_goods_fail_02
      - test_create_goods_fail_03
      - test_create_goods_fail_04
      - test_create_goods_fail_05
      - test_create_goods_fail_06
      - test_create_goods_fail_07
    desc:
      - 商品名称为空
      - 商品价格为空
      - 商品价格传数字0
      - 商品数量为空
      - 商品分类未传
      - 商品名称重复
      - token无效
    Authorization:
      - ${read_extract(token)}
      - ${read_extract(token)}
      - ${read_extract(token)}
      - ${read_extract(token)}
      - ${read_extract(token)}
      - ${read_extract(token)}
      - ${read_extract(token)}${random_str(10)}
    goods_name:
      - null
      - 测试商品${random_str(6)}
      - 测试商品${random_str(6)}
      - 测试商品${random_str(6)}
      - 测试商品${random_str(6)}
      - ${read_extract(dup_goods_name)}
      - 测试商品${random_str(6)}
    goods_price:
      - 99
      - null
      - 0
      - 99
      - 99
      - 99
      - 99
    goods_number:
      - 100
      - 100
      - 100
      - null
      - 100
      - 100
      - 100
    goods_cat:
      - '1,2,3'
      - '1,2,3'
      - '1,2,3'
      - '1,2,3'
      - null
      - '1,2,3'
      - '1,2,3'
    msg:
      - 商品名称不能为空
      - 商品价格不能为空
      - 商品价格不能为空
      - 商品数量不能为空
      - 商品没有设置所属分类
      - 商品名称已存在
      - 无效token
  validate:
    equals:
      -
        - 200
        - status_code
      -
        - 400
        - json
        - $.meta.status
    contains:
      -
        - $parametrize{msg}
        - json
        - $.meta.msg
