-
  feature: 登录模块
  story: 登录接口
  title: 登录成功
  description: 登录admin账号
  requests:
    method: post
    url: /api/private/v1/login
    headers:
      Content-Type: application/json
    json:
      username: admin
      password: '123456'
  extract:
    -
      key: token
      attr: json
      expr: $.data.token
-
  feature: 订单管理模块
  story: 添加订单接口
  title: test_create_order_success_01
  description: 添加订单成功并提取order_id
  requests:
    method: post
    url: /api/private/v1/orders
    headers:
      Authorization: ${read_extract(token)}
      Content-Type: application/json
    json:
      user_id: 1
      order_price: 199
      order_fapiao_title: 个人
      consignee_addr: 测试地址
      goods:
        -
          goods_id: 1
          goods_price: 199
          goods_number: 1
  extract:
    -
      key: order_id
      attr: json
      expr: $.data.order_id
  validate:
    equals:
      -
        - 200
        - status_code
      -
        - 201
        - json
        - $.meta.status
    contains:
      -
        - 创建订单成功
        - json
        - $.meta.msg
