-
  feature: 登录模块
  story: 登录接口
  title: 登录成功
  description: 登录admin账号
  requests:
    method: post
    url: /api/private/v1/login
    headers:
      Content-Type: application/json
    json:
      username: admin
      password: '123456'
  extract:
    -
      key: token
      attr: json
      expr: $.data.token
-
  feature: 商品管理模块
  story: 添加商品接口
  title: 预置商品-用于删除测试
  description: 创建商品获取goods_id
  requests:
    method: post
    url: /api/private/v1/goods
    headers:
      Authorization: ${read_extract(token)}
      Content-Type: application/json
    json:
      goods_name: 删除测试商品${random_str(6)}
      goods_price: 99
      goods_number: 100
      goods_cat: '1,2,3'
      goods_weight: 1
  extract:
    -
      key: goods_id
      attr: json
      expr: $.data.goods_id
-
  feature: 商品管理模块
  story: 删除商品接口
  title: 删除商品成功
  description: 根据goods_id删除商品成功
  requests:
    method: delete
    url: /api/private/v1/goods/${read_extract(goods_id)}
    headers:
      Authorization: ${read_extract(token)}
      Content-Type: application/json
  validate:
    equals:
      -
        - 200
        - status_code
      -
        - 200
        - json
        - $.meta.status
    contains:
      -
        - 删除成功
        - json
        - $.meta.msg
