-
  feature: 登录模块
  story: 登录接口
  title: 登录成功
  description: 登录admin账号
  requests:
    method: post
    url: /api/private/v1/login
    headers:
      Content-Type: application/json
    json:
      username: admin
      password: '123456'
  extract:
    -
      key: token
      attr: json
      expr: $.data.token
-
  feature: 商品分类模块
  story: 参数详情接口
  title: test_get_category_attr_detail_success_01
  description: 获取分类参数详情成功
  requests:
    method: get
    url: /api/private/v1/categories/1/attributes/1
    headers:
      Authorization: ${read_extract(token)}
      Content-Type: application/json
  validate:
    equals:
      -
        - 200
        - status_code
      -
        - 200
        - json
        - $.meta.status
    contains:
      -
        - 获取成功
        - json
        - $.meta.msg
