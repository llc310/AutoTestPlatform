-
  feature: 登录模块
  story: 登录接口
  title: 登录成功
  description: 登录admin账号
  requests:
    method: post
    url: /api/private/v1/login
    headers:
      Content-Type: application/json
    json:
      username: admin
      password: '123456'
  extract:
    -
      key: token
      attr: json
      expr: $.data.token
-
  feature: 商品分类模块
  story: 分类列表接口
  title: test_get_category_list_fail_01
  description: token无效获取分类列表失败
  requests:
    method: get
    url: /api/private/v1/categories
    headers:
      Authorization: invalidtoken
      Content-Type: application/json
    params:
      pagenum: 1
      pagesize: 10
  validate:
    equals:
      -
        - 200
        - status_code
      -
        - 400
        - json
        - $.meta.status
    contains:
      -
        - 无效token
        - json
        - $.meta.msg
