-
  feature: 登录模块
  story: 登录接口
  title: 登录成功
  description: 登录admin账号
  requests:
    method: post
    url: /api/private/v1/login
    headers:
      Content-Type: application/json
    json:
      username: admin
      password: '123456'
  extract:
    -
      key: token
      attr: json
      expr: $.data.token
-
  feature: 订单管理模块
  story: 订单详情接口
  title: $parametrize{title}
  description: 订单详情参数校验失败
  requests:
    method: get
    url: /api/private/v1/orders/$parametrize{id}
    headers:
      Authorization: $parametrize{auth}
      Content-Type: application/json
  parametrize:
    title:
      - test_get_order_detail_fail_01
      - test_get_order_detail_fail_02
      - test_get_order_detail_fail_03
    id:
      - ''
      - ${random_int(90000,99999)}
      - 1
    auth:
      - ${read_extract(token)}
      - ${read_extract(token)}
      - invalidtoken
    msg:
      - 用户ID不能为空
      - 订单ID不能存在
      - 无效token
  validate:
    equals:
      -
        - 200
        - status_code
      -
        - 400
        - json
        - $.meta.status
    contains:
      -
        - $parametrize{msg}
        - json
        - $.meta.msg
