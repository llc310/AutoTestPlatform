-
  feature: 登录模块
  story: 登录接口
  title: 登录成功
  description: 登录admin账号
  requests:
    method: post
    url: /api/private/v1/login
    headers:
      Content-Type: application/json
    json:
      username: admin
      password: '123456'
  extract:
    -
      key: token
      attr: json
      expr: $.data.token
-
  feature: 订单管理模块
  story: 订单列表接口
  title: $parametrize{title}
  description: 订单列表参数校验失败
  requests:
    method: get
    url: /api/private/v1/orders
    headers:
      Authorization: $parametrize{auth}
      Content-Type: application/json
    params:
      pagenum: $parametrize{pagenum}
      pagesize: $parametrize{pagesize}
  parametrize:
    title:
      - test_get_order_list_fail_01
      - test_get_order_list_fail_02
      - test_get_order_list_fail_03
      - test_get_order_list_fail_04
      - test_get_order_list_fail_05
    pagenum:
      - null
      - 0
      - 1
      - 1
      - 1
    pagesize:
      - 10
      - 10
      - null
      - 0
      - 10
    auth:
      - ${read_extract(token)}
      - ${read_extract(token)}
      - ${read_extract(token)}
      - ${read_extract(token)}
      - invalidtoken
    msg:
      - pagenum 参数错误
      - pagenum 参数错误
      - pagesize 参数错误
      - pagesize 参数错误
      - 无效token
  validate:
    equals:
      -
        - 200
        - status_code
      -
        - 400
        - json
        - $.meta.status
    contains:
      -
        - $parametrize{msg}
        - json
        - $.meta.msg
