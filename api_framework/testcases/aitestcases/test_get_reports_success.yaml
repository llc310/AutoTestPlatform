-
  feature: 登录模块
  story: 登录接口
  title: 登录成功
  description: 登录admin账号
  requests:
    method: post
    url: /api/private/v1/login
    headers:
      Content-Type: application/json
    json:
      username: admin
      password: '123456'
  extract:
    -
      key: token
      attr: json
      expr: $.data.token
-
  feature: 数据报表模块
  story: 获取报表数据接口
  title: $parametrize{title}
  description: 获取报表类型$parametrize{typeid}数据成功
  requests:
    method: get
    url: /api/private/v1/reports/type/$parametrize{typeid}
    headers:
      Authorization: ${read_extract(token)}
      Content-Type: application/json
  parametrize:
    title:
      - test_get_reports_success_01
      - test_get_reports_success_02
    typeid:
      - 1
      - 2
  validate:
    equals:
      -
        - 200
        - status_code
      -
        - 200
        - json
        - $.meta.status
    contains:
      -
        - 获取报表成功
        - json
        - $.meta.msg
