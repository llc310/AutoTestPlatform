-
  feature: 登录模块
  story: 登录接口
  title: 登录成功
  description: 登录admin账号
  requests:
    method: post
    url: /api/private/v1/login
    headers:
      Content-Type: application/json
    json:
      username: admin
      password: '123456'
  extract:
    -
      key: token
      attr: json
      expr: $.data.token
-
  feature: 权限管理模块
  story: 获取权限列表接口
  title: $parametrize{title}
  description: 权限列表类型参数校验失败
  requests:
    method: get
    url: /api/private/v1/rights/$parametrize{type}
    headers:
      Authorization: $parametrize{auth}
      Content-Type: application/json
  parametrize:
    title:
      - test_get_rights_fail_01
      - test_get_rights_fail_02
      - test_get_rights_fail_03
    type:
      - ''
      - abc
      - list
    auth:
      - ${read_extract(token)}
      - ${read_extract(token)}
      - invalidtoken
    msg:
      - 显示类型未定义
      - 显示类型参数错误
      - 无效token
  validate:
    equals:
      -
        - 200
        - status_code
      -
        - 400
        - json
        - $.meta.status
    contains:
      -
        - $parametrize{msg}
        - json
        - $.meta.msg
