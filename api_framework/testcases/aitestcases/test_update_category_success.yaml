-
  feature: 登录模块
  story: 登录接口
  title: 登录成功
  description: 登录admin账号
  requests:
    method: post
    url: /api/private/v1/login
    headers:
      Content-Type: application/json
    json:
      username: admin
      password: '123456'
  extract:
    -
      key: token
      attr: json
      expr: $.data.token
-
  feature: 商品分类模块
  story: 创建分类接口
  title: 创建分类成功
  description: 创建分类用于更新
  requests:
    method: post
    url: /api/private/v1/categories
    headers:
      Authorization: ${read_extract(token)}
      Content-Type: application/json
    json:
      cat_name: ${random_str(10)}
      cat_pid: 0
      cat_level: 0
  extract:
    -
      key: cat_id
      attr: json
      expr: $.data.cat_id
-
  feature: 商品分类模块
  story: 更新分类接口
  title: test_update_category_success_01
  description: 更新分类名称成功
  requests:
    method: put
    url: /api/private/v1/categories/${read_extract(cat_id)}
    headers:
      Authorization: ${read_extract(token)}
      Content-Type: application/json
    json:
      cat_name: 新名称${random_str(6)}
  validate:
    equals:
      -
        - 200
        - status_code
      -
        - 200
        - json
        - $.meta.status
    contains:
      -
        - 更新成功
        - json
        - $.meta.msg
