-
  feature: 登录模块
  story: 登录接口
  title: 登录成功
  description: 登录admin账号
  requests:
    method: post
    url: /api/private/v1/login
    headers:
      Content-Type: application/json
    json:
      username: admin
      password: '123456'
  extract:
    -
      key: token
      attr: json
      expr: $.data.token
-
  feature: 商品管理模块
  story: 添加商品接口
  title: 预置商品A-用于更新目标
  description: 创建商品A作为更新目标
  requests:
    method: post
    url: /api/private/v1/goods
    headers:
      Authorization: ${read_extract(token)}
      Content-Type: application/json
    json:
      goods_name: 更新目标${random_str(6)}
      goods_price: 99
      goods_number: 100
      goods_cat: '1,2,3'
      goods_weight: 1
  extract:
    -
      key: goods_id
      attr: json
      expr: $.data.goods_id
-
  feature: 商品管理模块
  story: 添加商品接口
  title: 预置商品B-用于重复名称
  description: 创建商品B用于重复名称断言
  requests:
    method: post
    url: /api/private/v1/goods
    headers:
      Authorization: ${read_extract(token)}
      Content-Type: application/json
    json:
      goods_name: 重复名称${random_str(6)}
      goods_price: 88
      goods_number: 50
      goods_cat: '1,2,3'
      goods_weight: 1
  extract:
    -
      key: dup_goods_name
      attr: json
      expr: $.data.goods_name
-
  feature: 商品管理模块
  story: 更新商品接口
  title: $parametrize{title}
  description: 更新商品失败-$parametrize{desc}
  requests:
    method: put
    url: /api/private/v1/goods/$parametrize{id}
    headers:
      Authorization: $parametrize{Authorization}
      Content-Type: application/json
    json:
      goods_name: $parametrize{goods_name}
      goods_price: 199
      goods_number: 50
      goods_cat: '1,2,3'
  parametrize:
    title:
      - test_update_goods_fail_01
      - test_update_goods_fail_02
      - test_update_goods_fail_03
      - test_update_goods_fail_04
      - test_update_goods_fail_05
    desc:
      - 商品ID为空
      - 商品ID非数字
      - 商品名称为空
      - 商品名称重复
      - token无效
    Authorization:
      - ${read_extract(token)}
      - ${read_extract(token)}
      - ${read_extract(token)}
      - ${read_extract(token)}
      - ${read_extract(token)}${random_str(10)}
    id:
      - null
      - abc${random_str(4)}
      - ${read_extract(goods_id)}
      - ${read_extract(goods_id)}
      - ${read_extract(goods_id)}
    goods_name:
      - 新名称${random_str(4)}
      - 新名称${random_str(4)}
      - null
      - ${read_extract(dup_goods_name)}
      - 新名称${random_str(4)}
    msg:
      - 商品ID不能为空
      - 商品ID必须是数字
      - 商品名称不能为空
      - 商品名称已存在
      - 无效token
  validate:
    equals:
      -
        - 200
        - status_code
      -
        - 400
        - json
        - $.meta.status
    contains:
      -
        - $parametrize{msg}
        - json
        - $.meta.msg
