-
  feature: 登录模块
  story: 登录接口
  title: 登录成功
  description: 登录admin账号
  requests:
    method: post
    url: /api/private/v1/login
    headers:
      Content-Type: application/json
    json:
      username: admin
      password: '123456'
  extract:
    -
      key: token
      attr: json
      expr: $.data.token
-
  feature: 用户管理模块
  story: 查询用户列表接口
  title: 查询用户列表成功
  description: 查询用户列表提取非admin用户id
  requests:
    method: get
    url: /api/private/v1/users
    headers:
      Authorization: ${read_extract(token)}
      Content-Type: application/json
    params:
      pagenum: 1
      pagesize: 10
  extract:
    -
      key: id
      attr: json
      expr: $.data.users[1].id
-
  feature: 用户管理模块
  story: 修改用户信息接口
  title: test_update_user_info_success_01
  description: 修改用户mobile和email成功
  requests:
    method: put
    url: /api/private/v1/users/${read_extract(id)}
    headers:
      Authorization: ${read_extract(token)}
      Content-Type: application/json
    json:
      mobile: '139${random_int(10000000,99999999)}'
      email: 'user${random_int(1000,9999)}@test.com'
  validate:
    equals:
      -
        - 200
        - status_code
      -
        - 200
        - json
        - $.meta.status
    contains:
      -
        - 更新成功
        - json
        - $.meta.msg
