-
  feature: 登录模块
  story: 登录接口
  title: 登录成功
  description: 登录admin账号
  requests:
    method: post
    url: /api/private/v1/login
    headers:
      Content-Type: application/json
    json:
      username: admin
      password: '123456'
  extract:
    -
      key: token
      attr: json
      expr: $.data.token
-
  feature: 文件上传模块
  story: 文件上传接口
  title: test_upload_fail_01
  description: 未传file字段导致服务端异常
  requests:
    method: post
    url: /api/private/v1/upload
    headers:
      Authorization: ${read_extract(token)}
      Content-Type: application/json
  validate:
    equals:
      -
        - 500
        - status_code
