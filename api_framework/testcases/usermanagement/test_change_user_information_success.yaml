-
  feature: 登录模块
  story: 登录接口
  title: 登录成功
  description: 登录admin账号成功
  requests:
    method: post
    url: /api/private/v1/login
    headers:
      Content-Type: application/json
    params:
      username: admin
      password: '123456'
  extract:
    -
      key: token
      attr: json
      expr: $.data.token
-
  feature: 用户管理模块
  story: 查询用户列表接口
  title: 获取用户列表成功
  description: 查询用户接口列表成功
  requests:
    method: get
    url: /api/private/v1/users
    headers:
      Content-Type: application/json
      Authorization: ${read_extract(token)}
    params:
      pagenum: 1
      pagesize: 20
  parametrize:
    expr:
      - $.data.users[0].id
      - $.data.users[1].id
      - $.data.users[2].id
      - $.data.users[3].id
      - $.data.users[4].id
      - $.data.users[5].id
      - $.data.users[6].id
      - $.data.users[7].id
      - $.data.users[8].id
      - $.data.users[9].id
  extract:
    -
      key: id
      attr: json
      expr: $parametrize{expr}
