-
  feature: 登录模块
  story: 登录接口
  title: 登录成功
  description: 登录$parametrize{username}账号成功
  requests:
    method: post
    url: /api/private/v1/login
    headers:
      Content-Type: application/json
    params:
      username: $parametrize{username}
      password: $parametrize{password}
  parametrize:
    username:
      - admin
      - admin
      - admin
      - admin
      - admin
      - admin
      - llc
      - admin
    password:
      - '123456'
      - '123456'
      - '123456'
      - '123456'
      - '123456'
      - '123456'
      - 3526823227llc
      - '123456'
  extract:
    -
      key: token
      attr: json
      expr: $.data.token
