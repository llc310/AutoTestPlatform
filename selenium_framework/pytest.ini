[pytest]
# 测试用例目录
testpaths = testcases

# 测试用例文件匹配规则
python_files = test_*.py

# 测试用例类匹配规则
python_classes = Test*

# 测试用例方法匹配规则
python_functions = test_*

# 日志文件位置
log_file = ./log/frame.log
# 日志文件等级
log_file_level = INFO
# 日志文件日期格式
log_file_date_format = %Y-%m-%d %H:%M:%S
# 日志文件显示格式
log_file_format = %(asctime)s [ %(levelname)s ] %(filename)s:%(lineno)s | %(message)s