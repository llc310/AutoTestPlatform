- feature: 登录模块
  story: 登录接口
  title: 登录成功
  description: 登录admin账号
  requests:
    method: POST
    url: /api/private/v1/login
    json:
      username: admin
      password: '123456'
    headers:
      Content-Type: application/json
  extract:
  - key: token
    attr: json
    expr: $.data.token
- feature: 用户管理模块
  story: 创建用户接口
  title: $parametrize{title}
  description: 创建用户$parametrize{username}账号成功
  requests:
    method: POST
    url: /api/private/v1/users
    json:
      username: $parametrize{username}
      password: $parametrize{password}
      mobile: $parametrize{mobile}
      email: $parametrize{email}
      rid: $parametrize{rid}
    headers:
      Authorization: ${read_extract(token)}
      Content-Type: application/json
  parametrize:
    title:
    - test_create_user_success_01
    - test_create_user_success_02
    username:
    - llc
    - user
    password:
    - 3526823227llc
    - 123456a
    mobile:
    - '13451038652'
    - '13451038651'
    email:
    - llc3526823227@163.com
    - llc3526823221@163.com
    rid:
    - 10
    - 11
  validate:
    equals:
    - - 200
      - status_code
    contains:
    - - 创建成功
      - json
      - $.meta.msg
